<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆款选题分析 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex selection:bg-blue-100 selection:text-blue-900">

    <!-- Mobile Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-20 hidden lg:hidden transition-opacity duration-300"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-200 z-30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col">
        <!-- Logo / Brand -->
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 text-sm leading-tight">选题分析系统</h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Pro Dashboard</p>
                </div>
            </div>
        </div>

        <!-- History List -->
        <div class="flex-1 overflow-y-auto py-4 px-3 no-scrollbar">
            <div class="mb-2 px-3">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">历史报告</h3>
            </div>
            <ul id="historyList" class="space-y-1">
                <!-- Items injected by JS -->
                <li class="px-3 py-4 text-center">
                    <div class="inline-block w-6 h-6 border-2 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                </li>
            </ul>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
            <div class="flex items-center gap-3 px-2">
                <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-blue-100 to-indigo-100 border border-blue-50 flex items-center justify-center text-xs font-bold text-blue-600">
                    AI
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium text-slate-900 truncate">Auto Analyst</p>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        <p class="text-[10px] text-slate-500">System Online</p>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full lg:ml-64 relative bg-slate-50 w-full transition-all duration-300">

        <!-- Mobile Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:hidden z-10 flex-shrink-0">
            <button id="sidebarToggle" class="p-2 -ml-2 text-slate-600 hover:bg-slate-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <span class="font-semibold text-slate-900">仪表盘</span>
            <div class="w-8"></div> <!-- Spacer -->
        </header>

        <!-- Content Container -->
        <div class="flex-1 relative overflow-hidden">

            <!-- Loading State -->
            <div id="loadingState" class="absolute inset-0 z-20 bg-white/80 backdrop-blur-sm flex items-center justify-center hidden">
                <div class="text-center p-6 bg-white rounded-xl shadow-lg border border-slate-100">
                    <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-medium text-slate-600">数据加载中...</p>
                </div>
            </div>

            <!-- Error State -->
            <div id="errorState" class="absolute inset-0 z-30 bg-white flex items-center justify-center hidden">
                <div class="text-center max-w-sm mx-auto px-4">
                    <div class="w-16 h-16 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2">加载失败</h3>
                    <p id="errorMessage" class="text-sm text-slate-500 mb-6">无法获取数据文件</p>
                    <button id="retryBtn" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                        重新尝试
                    </button>
                </div>
            </div>

            <!-- Empty / Welcome State -->
            <div id="welcomeState" class="absolute inset-0 z-10 flex items-center justify-center bg-slate-50 hidden">
                <div class="text-center max-w-lg mx-auto px-6">
                    <div class="mb-8">
                        <div class="w-20 h-20 bg-white rounded-3xl shadow-sm border border-slate-200 flex items-center justify-center mx-auto mb-6 transform -rotate-3">
                            <span class="text-4xl">📊</span>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900 mb-3">欢迎回来</h2>
                        <p class="text-slate-500 leading-relaxed">
                            请从左侧列表选择一期报告以查看详细的爆款选题分析。<br>
                            系统会自动分析最新的小红书热门内容趋势。
                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">最新收录</p>
                            <p id="latestReportDate" class="text-lg font-bold text-slate-900">-</p>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">累计报告</p>
                            <p id="totalReportsCount" class="text-lg font-bold text-slate-900">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Report Iframe -->
            <iframe id="reportFrame" name="contentFrame" class="w-full h-full border-0 bg-white hidden" title="Report Content"></iframe>

        </div>
    </main>

    <script src="assets/js/report.js"></script>
</body>
</html>
