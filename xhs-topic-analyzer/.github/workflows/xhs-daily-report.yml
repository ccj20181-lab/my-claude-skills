name: 小红书财经爆款日报 (智谱 AI 版本)

on:
  # 定时触发：每天北京时间 09:00 (UTC 01:00)
  schedule:
    - cron: '0 1 * * *'

  # 手动触发
  workflow_dispatch:

env:
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  WECHAT_PUSH_TOKEN: ${{ secrets.WECHAT_PUSH_TOKEN }}

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 xiaohongshu-mcp
        run: |
          npm install -g xiaohongshu-mcp-steve
          echo "✓ xiaohongshu-mcp 已安装"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备小红书 Cookies
        run: |
          echo '${{ secrets.XHS_COOKIES }}' > /tmp/xhs_cookies.json
          echo "✓ Cookies 文件已创建"

      - name: 启动 xiaohongshu-mcp Server
        run: |
          echo "启动 MCP Server (端口 18060)..."

          # 启动 xiaohongshu-mcp
          nohup xiaohongshu-mcp \
            --port 18060 \
            --headless \
            --cookies /tmp/xhs_cookies.json \
            > /tmp/mcp_server.log 2>&1 &

          # 等待服务启动
          echo "等待 MCP Server 启动..."
          for i in {1..15}; do
            if curl -s http://localhost:18060/ > /dev/null 2>&1; then
              echo "✓ MCP Server 已就绪"
              break
            fi
            echo "等待中... ($i/15)"
            sleep 2
          done

          # 检查是否成功启动
          if ! curl -s http://localhost:18060/ > /dev/null 2>&1; then
            echo "✗ MCP Server 启动失败，查看日志："
            cat /tmp/mcp_server.log
            exit 1
          fi

      - name: 运行 Anthropic Agent (智谱 AI)
        run: |
          python scripts/agent_runner.py
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}

      - name: 数据校验
        run: |
          python scripts/validate_data.py data.json

      - name: 生成报告并推送微信
        run: |
          python scripts/push_report.py --file data.json
        env:
          WECHAT_PUSH_TOKEN: ${{ secrets.WECHAT_PUSH_TOKEN }}

      - name: 上传报告数据（可选）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: |
            data.json
          retention-days: 7

      - name: 清理
        if: always()
        run: |
          # 停止 MCP Server
          pkill -f xiaohongshu-mcp || true

          # 删除敏感文件
          rm -f /tmp/xhs_cookies.json
          rm -f data.json

          echo "✓ 清理完成"

      - name: 失败通知
        if: failure()
        run: |
          # 如果执行失败，发送通知到微信
          curl -X POST http://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d '{
              "token": "${{ secrets.WECHAT_PUSH_TOKEN }}",
              "title": "⚠️ 小红书爆款日报执行失败",
              "content": "GitHub Actions 执行失败，请查看日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "template": "markdown"
            }' || true
