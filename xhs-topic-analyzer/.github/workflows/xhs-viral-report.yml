name: 小红书低粉爆文日报

on:
  # 定时触发：每天北京时间 10:30 (UTC 02:30)
  schedule:
    - cron: '30 2 * * *'

  # 手动触发
  workflow_dispatch:

env:
  WECHAT_PUSH_TOKEN: ${{ secrets.WECHAT_PUSH_TOKEN }}
  XHS_COOKIES: ${{ secrets.XHS_COOKIES }}

jobs:
  viral-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备小红书 Cookies
        run: |
          echo '${{ secrets.XHS_COOKIES }}' > /tmp/xhs_cookies.json
          echo "✓ Cookies 文件已创建"

      - name: 启动 xiaohongshu-mcp Server
        run: |
          echo "启动 MCP Server..."
          nohup xiaohongshu-mcp serve --port 3000 --cookies /tmp/xhs_cookies.json > /tmp/mcp_server.log 2>&1 &

          # 等待服务启动
          echo "等待 MCP Server 启动..."
          for i in {1..10}; do
            if curl -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "✓ MCP Server 已就绪"
              break
            fi
            echo "等待中... ($i/10)"
            sleep 2
          done

          # 检查是否成功启动
          if ! curl -s http://localhost:3000/health > /dev/null 2>&1; then
            echo "✗ MCP Server 启动失败，查看日志："
            cat /tmp/mcp_server.log
            exit 1
          fi

      - name: 运行低粉爆文分析
        run: |
          python scripts/viral_finder.py --config config.viral.json
        env:
          WECHAT_PUSH_TOKEN: ${{ secrets.WECHAT_PUSH_TOKEN }}

      - name: 上传 Excel 报告
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viral-report-${{ github.run_number }}
          path: ~/Documents/小红书爆文分析_*.xlsx
          retention-days: 30

      - name: 上传 JSON 数据
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viral-report-${{ github.run_number }}
          path: ~/Documents/xhs_viral_notes_*.json
          retention-days: 30

      - name: 清理
        if: always()
        run: |
          pkill -f xiaohongshu-mcp || true
          rm -f /tmp/xhs_cookies.json
