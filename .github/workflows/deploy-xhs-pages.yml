name: Deploy XHS Dashboard to Pages

on:
  # Trigger after the daily report workflow completes
  workflow_run:
    workflows: ["小红书财经爆款日报 (Claude Agent)"]
    types:
      - completed
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JSON Data
        uses: actions/download-artifact@v4
        with:
          pattern: viral-report-*
          path: /tmp/viral-data
          merge-multiple: true
          # If triggered by workflow_run, download from that run
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find JSON File
        id: find-json
        run: |
          JSON_FILE=$(find /tmp/viral-data -name "*.json" -type f | head -n 1)

          if [ -z "$JSON_FILE" ]; then
            echo "[WARN] No JSON data found"
            echo "json_found=false" >> $GITHUB_OUTPUT
            # We don't exit error here to allow manual runs to potentially just redeploy existing assets if needed,
            # but logic below depends on json.
            # actually if no json, we might just want to deploy existing docs?
            # But the goal is to update with new data.
            exit 0
          fi

          echo "Found JSON: $JSON_FILE"
          echo "json_path=$JSON_FILE" >> $GITHUB_OUTPUT
          echo "json_found=true" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.find-json.outputs.json_found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.find-json.outputs.json_found == 'true'
        run: |
          pip install --upgrade pip

      - name: Generate HTML Report
        if: steps.find-json.outputs.json_found == 'true'
        run: |
          # Use the script in the skill directory
          python xhs-topic-analyzer/scripts/generate_html_report.py --input "${{ steps.find-json.outputs.json_path }}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The docs directory is inside the skill folder
          path: xhs-topic-analyzer/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Info
        if: steps.deployment.outputs.status == 'success'
        run: |
          echo "🚀 Deployed Successfully!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
