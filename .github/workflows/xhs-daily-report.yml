name: 小红书财经爆款日报 (Claude Agent)

on:
  # Daily schedule: 06:30 Beijing Time (22:30 UTC)
  schedule:
    - cron: '30 22 * * *'

  # Manual trigger
  workflow_dispatch:

env:
  ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  XHS_COOKIES: ${{ secrets.XHS_COOKIES }}

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic xiaohongshu-mcp requests openpyxl

      - name: Prepare XHS Cookies
        run: |
          echo '${{ secrets.XHS_COOKIES }}' > /tmp/xhs_cookies.json
          echo "✓ Cookies file created"

      - name: Run Claude Agent Search
        run: |
          # Change directory to the skill's scripts folder
          cd xhs-topic-analyzer/scripts && python claude_agent_runner.py
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          XHS_COOKIES: ${{ secrets.XHS_COOKIES }}
          # Ensure script knows where to look for config relative to CWD
          PYTHONPATH: ${{ github.workspace }}/xhs-topic-analyzer

      - name: Analyze Data
        run: |
          # Run analysis from the skill root
          cd xhs-topic-analyzer && python analyze_data.py

      - name: Push Report & Generate HTML
        run: |
          # Run push script
          python xhs-topic-analyzer/scripts/push_report.py --file xhs-topic-analyzer/report.json
        env:
          WECHAT_PUSH_TOKEN: ${{ secrets.WECHAT_PUSH_TOKEN }}

      - name: Upload Report Data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: viral-report-${{ github.run_number }}
          path: |
            xhs-topic-analyzer/report.json
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/xhs_cookies.json
          rm -f xhs-topic-analyzer/data.json
          echo "✓ Cleanup done"

      - name: Failure Notification
        if: failure()
        run: |
          curl -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d '{
              "token": "${{ secrets.WECHAT_PUSH_TOKEN }}",
              "title": "⚠️ 小红书财经爆款日报执行失败",
              "content": "GitHub Actions 执行失败，请查看日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "template": "markdown"
            }' || true
